<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Globe — Sentinel Atlas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Mono:wght@300;400&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="/static/style.css?v=4" />
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #0a0a0a;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* Overlay UI */
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.8), transparent);
            border: none;
        }

        .site-nav {
            position: absolute;
            top: 70px;
            left: 0;
            width: 100%;
            z-index: 10;
            justify-content: center;
            background: transparent;
            border: none;
        }

        .nav-link {
            color: #fff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        }

        #coord-display {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-family: 'DM Mono', monospace;
            font-size: 14px;
            z-index: 10;
            pointer-events: none;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

    <header>
        <h1>Sentinel <em>Atlas</em></h1>
        <div id="status-pill">Initialising…</div>
    </header>

    <nav class="site-nav">
        <a href="/cam" class="nav-link">Cam</a>
        <a href="/convert" class="nav-link">Convert</a>
        <a href="/explore" class="nav-link">Explore</a>
        <a href="/globe" class="nav-link active">Globe</a>
    </nav>

    <div id="canvas-container"></div>
    <div id="coord-display">X: 0.00 | Y: 0.00</div>

    <script src="/static/globe.js"></script>
</body>

</html>
