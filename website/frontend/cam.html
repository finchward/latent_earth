<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Surveillance footage</title>
  <meta name="description" content="" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Mono:wght@300;400&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css?v=4" />
</head>

<body class="camera-page">

  <div class="layout">

    <aside id="info-sidebar" class="sidebar">
      <div id="hover-info" style="display: none;">
        <h2 id="info-location">...</h2>
      </div>
    </aside>

    <main id="main-area">
      <div id="camera-overlay">
        <button id="btn-enable-camera" class="primary">📸✅❓</button>
      </div>

      <div id="grid-outer" style="display:none">
        <div class="compass-wrap" id="compass-wrap">
          <div id="grid-wrapper"></div>
        </div>
      </div>
    </main>
  </div>

  <video id="camera-video" autoplay playsinline muted style="display:none;"></video>
  <canvas id="camera-canvas" width="400" height="400" style="display:none;"></canvas>

  <audio id="sonar-audio" loop style="display:none;">
    <source src="/static/sonar_clean.mov" />
  </audio>

  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-msg">Working…</div>
  </div>

  <div class="tooltip" id="gtooltip"></div>

  <script src="/static/cam.js?v=4"></script>
</body>

</html>
